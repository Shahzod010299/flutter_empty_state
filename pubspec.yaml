name: flutter_empty_state
description: Lightweight, theme-aware empty, error, no-internet, search-empty and loading state widgets for Flutter. Customizable and dependency-free.
version: 0.1.2
repository: https://github.com/Shahzod010299/flutter_empty_state
issue_tracker: https://github.com/Shahzod010299/flutter_empty_state/issues

topics:
  - ui
  - widgets
  - empty-state
  - placeholder
  - loading

screenshots:
  - description: "Empty state in light mode"
    path: screenshots/empty_state_light.png
  - description: "Error and no-internet states"
    path: screenshots/error_state_light.png
  - description: "Search-empty state"
    path: screenshots/search_empty_light.png
  - description: "Shimmer skeleton loader"
    path: screenshots/skeleton_light.png
  - description: "Empty state in dark mode"
    path: screenshots/empty_state_dark.png

environment:
  sdk: ">=3.2.0 <4.0.0"
  flutter: ">=3.16.0"

# Pure Flutter UI with no platform-specific code, so it runs everywhere Flutter
# does. Declared explicitly so pub.dev shows the supported platforms up front.
platforms:
  android:
  ios:
  linux:
  macos:
  web:
  windows:

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
